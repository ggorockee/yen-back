name: Server CI/CD

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/ci-server.yml"]
  pull_request:
    branches: [main]
    paths: ["server/**", ".github/workflows/ci-server.yml"]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.ref) || format('deploy-{0}', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"
  DOCKER_IMAGE: ggorockee/yen-back-server
  INFRA_REPO: ggorockee/infra
  VALUES_FILE_PATH: charts/helm/prod/yen-back/values.yaml

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - run: go mod download
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "latest"
          working-directory: ./server
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -o bin/api ./cmd/api

  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tag
        id: meta
        run: echo "tag=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./server
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest

  # GitOps: bump the image tag in the infra repo; ArgoCD deploys it.
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ref: main
          path: infra
      - name: Update values.yaml
        working-directory: ./server
        run: |
          go run ./cmd/bumpimage \
            -file "$GITHUB_WORKSPACE/infra/${{ env.VALUES_FILE_PATH }}" \
            -key image.tag \
            -value "${{ needs.build-and-push.outputs.image_tag }}"
      - name: Create PR in Infra Repo
        working-directory: ./infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
          # Untrusted input: pass via env, never interpolate into the script.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "${{ env.VALUES_FILE_PATH }}"
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="ci/update-yen-back-server-${TAG}"
          git checkout -b "$BRANCH"
          git commit -m "ci: Update yen-back-server image tag to ${TAG}"
          git push -u origin "$BRANCH"
          BODY="$(printf 'Auto-generated PR to update yen-back-server image tag\n\n**Image**: %s:%s\n**Triggered by**: %s\n' "$DOCKER_IMAGE" "$TAG" "$HEAD_COMMIT_MESSAGE")"
          PR_URL=$(gh pr create --title "ci: Update yen-back-server image to ${TAG}" --body "$BODY" --base main --head "$BRANCH")
          echo "Created PR: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL" || gh pr merge --squash --delete-branch "$PR_URL"
